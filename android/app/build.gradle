plugins { id 'com.android.application' }

def testStore = providers.environmentVariable('ZEITKONTO_TEST_KEYSTORE').orNull
android {
    namespace 'com.ltuga.zeitkonto'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ltuga.zeitkonto'
        minSdk 30
        targetSdk 36
        versionCode 6
        versionName '0.3.0'
        buildConfigField 'String', 'SUPABASE_URL', '"https://szidhxybypbueiewfidn.supabase.co"'
        // Publishable keys are intentionally safe for public mobile clients; RLS protects user data.
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_vjs6DElKu_O71aiLEg9BZQ_8oppS5Cy"'
    }
    signingConfigs {
        testUpdate {
            if (testStore != null) {
                storeFile file(testStore)
                storePassword providers.environmentVariable('ZEITKONTO_TEST_STORE_PASSWORD').orNull
                keyAlias providers.environmentVariable('ZEITKONTO_TEST_KEY_ALIAS').orNull
                keyPassword providers.environmentVariable('ZEITKONTO_TEST_KEY_PASSWORD').orNull
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.standalone'
            versionNameSuffix '-standalone'
            debuggable true
            if (testStore != null) {
                signingConfig signingConfigs.testUpdate
            }
        }
        release { minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
